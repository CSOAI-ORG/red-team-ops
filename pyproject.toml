[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "red-team-ops-mcp"
version = "0.1.0"
description = "MCP server for mobile (Android) red-team operations: APK decompilation, endpoint and API-call extraction, secret scanning, APK metadata"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
  {name = "MEOK AI Labs", email = "nicholas@meok.ai"},
]
keywords = ["mcp", "model-context-protocol", "red-team", "security", "android", "apk", "decompilation", "androguard", "meok"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
]
dependencies = [
  "mcp>=1.0.0",
  "pyjadx>=1.4.0",
  "androguard>=4.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/CSOAI-ORG/red-team-ops"
Repository = "https://github.com/CSOAI-ORG/red-team-ops"
Issues = "https://github.com/CSOAI-ORG/red-team-ops/issues"
PyPI = "https://pypi.org/project/red-team-ops-mcp/"
Smithery = "https://smithery.ai/server/red-team-ops-mcp"

[project.scripts]
red_team_ops_mcp = "server:main"

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["server.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
